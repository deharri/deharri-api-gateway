spring:
  application:
    name: deharri-api-gateway

  cloud:
    gateway:
      # Global CORS configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "http://localhost:5174"
              - "http://localhost:8081"
              - "http://184.73.182.190"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      # Route definitions
      routes:
        # User Management Service
        - id: user-mgmt-service
          uri: lb://user-mgmt-service
          predicates:
            - Path=/ums/**
          filters:
            - StripPrefix=1
            
        # Add more services here as needed
        # - id: another-service
        #   uri: lb://ANOTHER-SERVICE
        #   predicates:
        #     - Path=/another/**
        #   filters:
        #     - StripPrefix=1

      # Default filters applied to all routes
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

server:
  port: ${GATEWAY_PORT:8080}

# JWT Configuration - MUST use same secret as User Management Service
jwt:
  secret: ${JWT_SECRET:hMbhMVBaYZDAM4pNeTZ0uNt4M9e/Zv5io+tqukPce9Q=}

# Logging
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.deharri.gateway: DEBUG

# Actuator for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true