spring:
  application:
    name: deharri-api-gateway

  cloud:
    gateway:
      # Global CORS configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"  # Changed from allowedOrigins
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      # Route definitions
      routes:
        # User Management Service
        - id: user-mgmt-service
          uri: lb://user-mgmt-service
          predicates:
            - Path=/ums/**
          filters:
            - StripPrefix=1

        # Chat Service
        - id: chat-service
          uri: lb://chat-service
          predicates:
            - Path=/chat/**
          filters:
            - StripPrefix=1

        # Job Listing & Discovery Service
        - id: job-service
          uri: lb://job-service
          predicates:
            - Path=/jobs/**
          filters:
            - StripPrefix=1

        # Payment Service
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payments/**
          filters:
            - StripPrefix=1
            
      # Default filters applied to all routes
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

server:
  port: ${GATEWAY_PORT:8080}

jwt:
  secret: ${JWT_SECRET:hMbhMVBaYZDAM4pNeTZ0uNt4M9e/Zv5io+tqukPce9Q=}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.deharri.gateway: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true